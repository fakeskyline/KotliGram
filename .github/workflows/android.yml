name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KotliGram
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and vendor TDLib Java bindings and JNI binaries
        shell: bash
        run: |
          set -euo pipefail

          HAS_CLIENT=false
          for JAR in app/libs/*.jar; do
            [[ -f "$JAR" ]] || continue
            if jar tf "$JAR" 2>/dev/null | grep -qx 'org/drinkless/tdlib/Client.class'; then
              HAS_CLIENT=true
            fi
          done

          if [[ "$HAS_CLIENT" != true ]]; then
            mkdir -p app/libs app/src/main/jniLibs
            rm -f app/libs/tdlib-classes.jar
            curl --fail --location --retry 3 --retry-delay 2 \
              https://repo.maven.apache.org/maven2/io/github/tdlib-android/core/0.1.1/core-0.1.1.aar \
              --output /tmp/tdlib-core.aar

            echo "TDLib AAR contents:"
            unzip -Z1 /tmp/tdlib-core.aar

            unzip -p /tmp/tdlib-core.aar classes.jar > /tmp/tdlib-classes.jar || true
            if jar tf /tmp/tdlib-classes.jar 2>/dev/null | grep -qx 'org/drinkless/tdlib/Client.class'; then
              cp /tmp/tdlib-classes.jar app/libs/tdlib-classes.jar
            fi

            while IFS= read -r ENTRY; do
              [[ -z "$ENTRY" ]] && continue
              NAME="${ENTRY##*/}"
              unzip -p /tmp/tdlib-core.aar "$ENTRY" > "app/libs/$NAME"
            done < <(unzip -Z1 /tmp/tdlib-core.aar | grep '^libs/' | grep 'jar$' || true)

            for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
              mkdir -p "app/src/main/jniLibs/$ABI"
              unzip -p /tmp/tdlib-core.aar "jni/$ABI/libtdjni.so" > "app/src/main/jniLibs/$ABI/libtdjni.so"
              test -s "app/src/main/jniLibs/$ABI/libtdjni.so"
            done

            sha256sum /tmp/tdlib-core.aar > app/libs/TDLIB-AAR-SHA256.txt

            HAS_CLIENT=false
            HAS_TDAPI=false
            for JAR in app/libs/*.jar; do
              [[ -f "$JAR" ]] || continue
              jar tf "$JAR" | grep -qx 'org/drinkless/tdlib/Client.class' && HAS_CLIENT=true || true
              jar tf "$JAR" | grep -qx 'org/drinkless/tdlib/TdApi.class' && HAS_TDAPI=true || true
            done
            test "$HAS_CLIENT" = true
            test "$HAS_TDAPI" = true

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A app/libs app/src/main/jniLibs
            if ! git diff --cached --quiet; then
              git commit -m "Vendor TDLib Java bindings and JNI binaries [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Verify TDLib native payload
        shell: bash
        run: |
          set -euo pipefail
          HAS_CLIENT=false
          HAS_TDAPI=false
          for JAR in app/libs/*.jar; do
            [[ -f "$JAR" ]] || continue
            jar tf "$JAR" | grep -qx 'org/drinkless/tdlib/Client.class' && HAS_CLIENT=true || true
            jar tf "$JAR" | grep -qx 'org/drinkless/tdlib/TdApi.class' && HAS_TDAPI=true || true
          done
          test "$HAS_CLIENT" = true
          test "$HAS_TDAPI" = true
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/src/main/jniLibs/$ABI/libtdjni.so"
          done

      - name: Validate Telegram app credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "\$TELEGRAM_API_ID" =~ ^[0-9]+\$ ]]; then
            echo "TELEGRAM_API_ID is missing or invalid. Add it as a repository Actions secret."
            exit 1
          fi
          if [[ ! "\$TELEGRAM_API_HASH" =~ ^[0-9a-fA-F]{32}\$ ]]; then
            echo "TELEGRAM_API_HASH is missing or invalid. Add it as a repository Actions secret."
            exit 1
          fi

      - name: Build debug APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle :app:assembleDebug

      - name: Verify APK contains TDLib JNI
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libtdjni.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KotliGram-debug
          path: app/build/outputs/apk/debug/*.apk
